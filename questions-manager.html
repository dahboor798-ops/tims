<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الأسئلة — TIMSS 2027</title>
<style>
/* ===== الأنماط الأساسية ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'Tahoma', sans-serif;
  background: linear-gradient(135deg, #1a3a5c, #2c5f8a, #1e4d73);
  min-height: 100vh; color: #333; padding: 20px;
}
.hidden { display: none !important; }

.container {
  max-width: 1200px; margin: 0 auto; background: #fff;
  border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  overflow: hidden; animation: fadeIn .4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity:1; transform:none;} }

/* ===== الرأس ===== */
.header {
  background: linear-gradient(135deg, #1a3a5c, #2c5f8a);
  color: #fff; padding: 20px 24px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px;
}
.header-info h1 { font-size: 22px; margin-bottom: 4px; }
.header-info p { font-size: 13px; opacity: .85; }
.header-user { display: flex; align-items: center; gap: 20px; }
.user-badge {
  background: rgba(255,255,255,.15); padding: 8px 16px;
  border-radius: 12px; font-size: 14px; font-weight: 700;
  border: 1px solid rgba(255,255,255,.2);
}
.header-actions { display: flex; gap: 8px; }

/* ===== المحتوى ===== */
.content { padding: 24px; }

/* ===== الأزرار ===== */
.btn {
  padding: 10px 20px; border-radius: 10px; border: none;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .2s; display: inline-flex;
  align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, #1a3a5c, #2c5f8a); color: #fff; }
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(26,58,92,.35); }
.btn-light { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.3); }
.btn-light:hover { background: rgba(255,255,255,.3); }
.btn-success { background: #1e7e34; color: #fff; }
.btn-success:hover:not(:disabled) { background: #16652a; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-danger:hover:not(:disabled) { background: #a93226; }
.btn-secondary { background: #eef2f6; color: #2c5f8a; }
.btn-secondary:hover:not(:disabled) { background: #d8e2ec; }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

/* ===== شريط الأدوات ===== */
.toolbar {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
  padding: 15px; background: #f8fbfd; border: 2px solid #eef2f6; border-radius: 12px;
  align-items: center;
}
.toolbar input, .toolbar select {
  padding: 10px 14px; border: 2px solid #d8e2ec; border-radius: 10px;
  font-family: inherit; font-size: 14px; background: #fff;
}
.toolbar input:focus, .toolbar select:focus { outline: none; border-color: #2c5f8a; }
.toolbar .spacer { flex: 1; }

/* ===== الجداول ===== */
.table-wrap {
  background: #fff; border: 1px solid #e4ecf3; border-radius: 12px;
  overflow: auto; max-height: 600px;
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
  background: #f0f4f8; color: #1a3a5c; font-weight: 700;
  padding: 14px 12px; text-align: right; border-bottom: 2px solid #d8e2ec;
  position: sticky; top: 0; z-index: 2;
}
tbody td { padding: 12px; border-bottom: 1px solid #eef2f6; vertical-align: middle; }
tbody tr:hover { background: #f8fbfd; }
.empty-row td { text-align: center; padding: 40px; color: #6b7c8f; }

/* ===== المودال ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,30,50,.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal {
  background: #fff; border-radius: 16px; padding: 24px;
  max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.modal h2 { color: #1a3a5c; margin-bottom: 20px; border-bottom: 2px solid #eef2f6; padding-bottom: 10px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 700; color: #4a5c6e; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px; border: 2px solid #d8e2ec; border-radius: 10px;
  font-family: inherit; font-size: 14px; background: #fff;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: #2c5f8a;
}
.form-group textarea { resize: vertical; min-height: 100px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid #eef2f6; padding-top: 16px; }

/* ===== الخيارات (Options) ===== */
.options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
.option-row { display: flex; gap: 10px; align-items: center; }
.option-row input[type="text"] { flex: 1; }
.option-row input[type="radio"] { width: 20px; height: 20px; cursor: pointer; }
.option-row .btn-remove { background: #fee2e2; color: #dc2626; padding: 8px; border-radius: 8px; cursor: pointer; border: none; }

/* ===== الإشعارات ===== */
.toast-container {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 3000; display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: #333; color: #fff; padding: 12px 24px;
  border-radius: 10px; font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: toastIn .3s ease;
}
.toast.success { background: #1e7e34; }
.toast.error { background: #c0392b; }
.toast.warning { background: #b8860b; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px);} to { opacity:1; transform:none;} }

.loading {
  position: fixed; inset: 0; background: rgba(15,30,50,.85);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; z-index: 5000; color: #fff;
}
.spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- شاشة التحميل -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p style="margin-top: 15px;">جاري تحميل بنك الأسئلة...</p>
</div>

<!-- الحاوية الرئيسية -->
<div class="container hidden" id="mainContainer">
  <header class="header">
    <div class="header-info">
      <h1>📚 إدارة بنك الأسئلة</h1>
      <p>منصة TIMSS 2027 — إضافة وتعديل الأسئلة</p>
    </div>
    <div class="header-user">
      <div class="user-badge" id="userInfo">—</div>
      <div class="header-actions">
        <button class="btn btn-light" id="btnBack">↩️ رجوع</button>
        <button class="btn btn-light" data-logout>🚪 خروج</button>
      </div>
    </div>
  </header>

  <main class="content">
    <!-- شريط الأدوات والفلترة -->
    <div class="toolbar">
      <input type="text" id="searchQ" placeholder="🔍 بحث بنص السؤال..." style="min-width:200px;">
      <select id="filterSubject">
        <option value="">كل المواد</option>
        <option value="رياضيات">رياضيات</option>
        <option value="علوم">علوم</option>
      </select>
      <select id="filterType">
        <option value="">كل الأنواع</option>
        <option value="MCQ">اختيار من متعدد</option>
        <option value="TRUE_FALSE">صح / خطأ</option>
        <option value="SHORT_ANSWER">إجابة قصيرة</option>
      </select>
      <select id="filterDifficulty">
        <option value="">كل الصعوبات</option>
        <option value="EASY">سهل</option>
        <option value="MEDIUM">متوسط</option>
        <option value="HARD">صعب</option>
      </select>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="btnAddQuestion">➕ إضافة سؤال جديد</button>
    </div>

    <!-- جدول الأسئلة -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:50px;">#</th>
            <th>نص السؤال</th>
            <th>المادة</th>
            <th>النوع</th>
            <th>الصعوبة</th>
            <th>المستوى</th>
            <th>الحالة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="questionsBody">
          <tr class="empty-row"><td colspan="8">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ===== مودال إضافة/تعديل سؤال ===== -->
<div class="modal-overlay hidden" id="questionModal">
  <div class="modal">
    <h2 id="modalTitle">➕ إضافة سؤال جديد</h2>
    <form id="questionForm" onsubmit="event.preventDefault();">
      
      <div class="form-row">
        <div class="form-group">
          <label>المادة *</label>
          <select id="qSubject" required>
            <option value="رياضيات">رياضيات</option>
            <option value="علوم">علوم</option>
          </select>
        </div>
        <div class="form-group">
          <label>الفرع</label>
          <input type="text" id="qBranch" placeholder="مثال: الجبر، أحياء...">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>نوع السؤال *</label>
          <select id="qType" required>
            <option value="MCQ">اختيار من متعدد (MCQ)</option>
            <option value="TRUE_FALSE">صح / خطأ</option>
            <option value="SHORT_ANSWER">إجابة قصيرة</option>
          </select>
        </div>
        <div class="form-group">
          <label>الصعوبة *</label>
          <select id="qDifficulty" required>
            <option value="EASY">سهل</option>
            <option value="MEDIUM">متوسط</option>
            <option value="HARD">صعب</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>المستوى المعرفي *</label>
          <select id="qCognitive" required>
            <option value="KNOWING">معرفة (Knowing)</option>
            <option value="APPLYING">تطبيق (Applying)</option>
            <option value="REASONING">استدلال (Reasoning)</option>
          </select>
        </div>
        <div class="form-group">
          <label>الدرجة (Points)</label>
          <input type="number" id="qPoints" value="2.5" step="0.5" min="0">
        </div>
      </div>

      <div class="form-group">
        <label>نص السؤال *</label>
        <textarea id="qText" required placeholder="اكتب نص السؤال هنا..."></textarea>
      </div>

      <div class="form-group">
        <label>رابط الصورة (اختياري)</label>
        <input type="url" id="qMedia" placeholder="https://example.com/image.png">
      </div>

      <!-- الخيارات (تظهر فقط للـ MCQ) -->
      <div id="mcqOptionsContainer">
        <label style="display:block; font-size:13px; font-weight:700; color:#4a5c6e; margin-bottom:8px;">الخيارات (اختر الإجابة الصحيحة) *</label>
        <div class="options-list" id="optionsList">
          <div class="option-row">
            <input type="radio" name="correctOpt" value="A" checked>
            <input type="text" class="opt-text" data-id="A" placeholder="الخيار A" value="الخيار A">
          </div>
          <div class="option-row">
            <input type="radio" name="correctOpt" value="B">
            <input type="text" class="opt-text" data-id="B" placeholder="الخيار B" value="الخيار B">
          </div>
          <div class="option-row">
            <input type="radio" name="correctOpt" value="C">
            <input type="text" class="opt-text" data-id="C" placeholder="الخيار C" value="الخيار C">
          </div>
          <div class="option-row">
            <input type="radio" name="correctOpt" value="D">
            <input type="text" class="opt-text" data-id="D" placeholder="الخيار D" value="الخيار D">
          </div>
        </div>
      </div>

      <!-- إجابة صح/خطأ (تظهر فقط للـ TRUE_FALSE) -->
      <div id="tfAnswerContainer" class="hidden">
        <div class="form-group">
          <label>الإجابة الصحيحة *</label>
          <select id="qTFAnswer">
            <option value="true">صح (True)</option>
            <option value="false">خطأ (False)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>الشرح (Explanation)</label>
        <textarea id="qExplanation" placeholder="شرح الإجابة الصحيحة..." style="min-height:80px;"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('questionModal')">إلغاء</button>
        <button type="button" class="btn btn-light" id="btnPreview" style="background:#e0f2fe; color:#0284c7;">👁️ معاينة كطالب</button>
        <button type="submit" class="btn btn-primary" id="btnSaveQuestion">💾 حفظ السؤال</button>
      </div>
    </form>
  </div>
</div>

<!-- مودال المعاينة -->
<div class="modal-overlay hidden" id="previewModal">
  <div class="modal">
    <h2>👁️ معاينة السؤال (كما يراها الطالب)</h2>
    <div id="previewContent" style="line-height:1.8;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('previewModal')">إغلاق</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- السكربتات -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<script>
// ==========================================
// 1. الإعدادات الأساسية
// ==========================================
const DB = window.supabaseClient;
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type = 'info', ms = 3000) {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toastContainer').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms);
}

function closeModal(id) { $('#' + id).classList.add('hidden'); }

// ==========================================
// 2. الحالة العامة
// ==========================================
const state = {
  session: null,
  questions: [],
  editingQuestion: null
};

// ==========================================
// 3. التهيئة (حل الحلقة المفرغة)
// ==========================================
async function init() {
  try {
    if (!DB) throw new Error('فشل الاتصال بقاعدة البيانات.');

    const session = auth.getSession();
    
    // التحقق من الجلسة
    if (!session || !['admin', 'supervisor', 'teacher'].includes(session.role)) {
      sessionStorage.removeItem('timss_session');
      location.href = 'index.html';
      return;
    }

    if (session.role === 'teacher' && !session.can_add_questions) {
      toast('لا تملك صلاحية إدارة الأسئلة', 'error');
      setTimeout(() => { sessionStorage.removeItem('timss_session'); location.href = 'index.html'; }, 2000);
      return;
    }

    state.session = session;
    $('#userInfo').textContent = `${session.full_name} (${session.role})`;

    // زر الرجوع حسب الدور
    $('#btnBack').onclick = () => {
      if (session.role === 'admin') location.href = 'admin.html';
      else if (session.role === 'supervisor') location.href = 'supervisor.html';
      else location.href = 'teacher.html';
    };

    bindEvents();
    await loadQuestions();

    $('#loading').classList.add('hidden');
    $('#mainContainer').classList.remove('hidden');

  } catch (err) {
    console.error(err);
    $('#loading').innerHTML = `
      <div style="text-align: center; padding: 20px; color: #fff;">
        <h2 style="color: #ef4444; margin-bottom: 15px;">⚠️ خطأ في التحميل</h2>
        <p style="font-size: 16px;">${esc(err.message)}</p>
        <button onclick="location.href='index.html'" style="margin-top: 20px; padding: 10px 20px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; font-size: 16px;">العودة للدخول</button>
      </div>
    `;
  }
}

// ==========================================
// 4. جلب وعرض الأسئلة
// ==========================================
async function loadQuestions() {
  let q = DB.from('questions').select('*').order('created_at', { ascending: false });
  
  if (state.session.role === 'teacher') {
    q = q.eq('added_by_id', state.session.national_id).eq('added_by_role', 'teacher');
  }

  const { data, error } = await q;
  if (error) throw new Error('فشل جلب الأسئلة: ' + error.message);
  
  state.questions = data || [];
  renderQuestions();
}

function renderQuestions() {
  const q = ($('#searchQ').value || '').toLowerCase();
  const subj = $('#filterSubject').value;
  const type = $('#filterType').value;
  const diff = $('#filterDifficulty').value;

  const rows = state.questions.filter(x => 
    (!q || (x.question_text || '').toLowerCase().includes(q)) &&
    (!subj || x.subject === subj) &&
    (!type || x.question_type === type) &&
    (!diff || x.difficulty === diff)
  );

  const body = $('#questionsBody');
  if (!rows.length) {
    body.innerHTML = '<tr class="empty-row"><td colspan="8">لا توجد أسئلة مطابقة</td></tr>';
    return;
  }

  body.innerHTML = rows.map((x, i) => `
    <tr>
      <td>${i + 1}</td>
      <td style="max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${esc(x.question_text)}">
        ${esc(x.question_text)}
      </td>
      <td>${esc(x.subject)}</td>
      <td>${esc(x.question_type)}</td>
      <td>${diffBadge(x.difficulty)}</td>
      <td>${x.cognitive === 'KNOWING' ? 'معرفة' : x.cognitive === 'APPLYING' ? 'تطبيق' : 'استدلال'}</td>
      <td>${x.is_active ? '✅ نشط' : '⛔ معطّل'}</td>
      <td>
        <div style="display:flex; gap:5px;">
          <button class="btn btn-sm btn-primary" onclick="openEditQuestion(${x.id})">✏️ تعديل</button>
          <button class="btn btn-sm btn-success" onclick="previewQuestion(${x.id})">👁️ معاينة</button>
          <button class="btn btn-sm btn-danger" onclick="deleteQuestion(${x.id})">🗑️ حذف</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function diffBadge(d) {
  if (d === 'EASY') return '<span style="color:#1e7e34; font-weight:bold;">سهل</span>';
  if (d === 'MEDIUM') return '<span style="color:#b8860b; font-weight:bold;">متوسط</span>';
  if (d === 'HARD') return '<span style="color:#c0392b; font-weight:bold;">صعب</span>';
  return esc(d || '—');
}

// ==========================================
// 5. إضافة وتعديل وحذف الأسئلة
// ==========================================
function openAddQuestion() {
  state.editingQuestion = null;
  $('#modalTitle').textContent = '➕ إضافة سؤال جديد';
  $('#questionForm').reset();
  $('#qSubject').value = 'رياضيات';
  $('#qType').value = 'MCQ';
  $('#qPoints').value = '2.5';
  $('#qMedia').value = '';
  
  document.querySelectorAll('.opt-text').forEach(el => {
    el.value = 'الخيار ' + el.dataset.id;
  });
  document.querySelector('input[name="correctOpt"][value="A"]').checked = true;
  
  toggleQuestionTypeFields();
  $('#questionModal').classList.remove('hidden');
}

function openEditQuestion(id) {
  const q = state.questions.find(x => x.id === id);
  if (!q) return;
  
  state.editingQuestion = q;
  $('#modalTitle').textContent = '✏️ تعديل سؤال';
  
  $('#qSubject').value = q.subject;
  $('#qBranch').value = q.branch || '';
  $('#qType').value = q.question_type;
  $('#qDifficulty').value = q.difficulty;
  $('#qCognitive').value = q.cognitive;
  $('#qPoints').value = q.points;
  $('#qText').value = q.question_text;
  $('#qMedia').value = q.media_url || '';
  $('#qExplanation').value = q.explanation || '';

  if (q.question_type === 'MCQ' && q.options && Array.isArray(q.options)) {
    q.options.forEach(opt => {
      const input = document.querySelector(`.opt-text[data-id="${opt.id}"]`);
      if (input) input.value = opt.text;
    });
    const correctRadio = document.querySelector(`input[name="correctOpt"][value="${q.correct_answer}"]`);
    if (correctRadio) correctRadio.checked = true;
  }

  if (q.question_type === 'TRUE_FALSE') {
    $('#qTFAnswer').value = String(q.correct_answer);
  }

  toggleQuestionTypeFields();
  $('#questionModal').classList.remove('hidden');
}

// ⚠️ دالة الحذف الجديدة
async function deleteQuestion(id) {
  const q = state.questions.find(x => x.id === id);
  if (!q) return;

  // نأخذ أول 50 حرفاً من السؤال لعرضها في رسالة التأكيد
  const shortText = q.question_text.length > 50 ? q.question_text.substring(0, 50) + '...' : q.question_text;
  
  if (!confirm(`هل أنت متأكد من حذف هذا السؤال؟\n\n"${shortText}"\n\n⚠️ سيتم حذف جميع محاولات الطلاب المرتبطة بهذا السؤال نهائياً. لا يمكن التراجع.`)) {
    return;
  }

  try {
    // بما أن جدول student_question_attempts يحتوي على ON DELETE CASCADE
    // فإن حذف السؤال سيحذف المحاولات تلقائياً
    const { error } = await DB.from('questions').delete().eq('id', id);
    if (error) throw error;
    
    toast('🗑️ تم حذف السؤال ومحاولاته بنجاح', 'success');
    await loadQuestions();
  } catch (err) {
    toast('فشل حذف السؤال: ' + err.message, 'error');
  }
}

function toggleQuestionTypeFields() {
  const type = $('#qType').value;
  $('#mcqOptionsContainer').classList.toggle('hidden', type !== 'MCQ');
  $('#tfAnswerContainer').classList.toggle('hidden', type !== 'TRUE_FALSE');
}

async function saveQuestion(e) {
  e.preventDefault();
  const btn = $('#btnSaveQuestion');
  btn.disabled = true;

  try {
    const type = $('#qType').value;
    let options = null;
    let correct_answer = null;

    if (type === 'MCQ') {
      const opts = [];
      document.querySelectorAll('.opt-text').forEach(el => {
        if (el.value.trim()) opts.push({ id: el.dataset.id, text: el.value.trim() });
      });
      if (opts.length < 2) throw new Error('يجب إدخال خيارين على الأقل');
      options = opts;
      
      const selected = document.querySelector('input[name="correctOpt"]:checked');
      if (!selected) throw new Error('يجب اختيار الإجابة الصحيحة');
      correct_answer = selected.value;
    } 
    else if (type === 'TRUE_FALSE') {
      correct_answer = $('#qTFAnswer').value === 'true';
    } 
    else {
      correct_answer = "إجابة قصيرة";
    }

    const payload = {
      subject: $('#qSubject').value,
      branch: $('#qBranch').value.trim() || null,
      question_type: type,
      question_text: $('#qText').value.trim(),
      media_url: $('#qMedia').value.trim() || null,
      options: options ? JSON.stringify(options) : null,
      correct_answer: JSON.stringify(correct_answer),
      cognitive: $('#qCognitive').value,
      difficulty: $('#qDifficulty').value,
      points: Number($('#qPoints').value) || 2.5,
      explanation: $('#qExplanation').value.trim() || null,
      is_active: true
    };

    if (state.editingQuestion) {
      const { error } = await DB.from('questions').update(payload).eq('id', state.editingQuestion.id);
      if (error) throw error;
      toast('✅ تم تحديث السؤال', 'success');
    } else {
      payload.added_by_id = state.session.national_id;
      payload.added_by_role = state.session.role;
      
      const { error } = await DB.from('questions').insert(payload);
      if (error) throw error;
      toast('✅ تم إضافة السؤال', 'success');
    }

    closeModal('questionModal');
    await loadQuestions();
  } catch (err) {
    toast('فشل الحفظ: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

// ==========================================
// 6. المعاينة
// ==========================================
function previewQuestion(id) {
  const q = state.questions.find(x => x.id === id);
  if (!q) return;

  let html = `<div style="margin-bottom:15px; font-size:16px; font-weight:bold; color:#1a3a5c;">${esc(q.question_text)}</div>`;
  
  if (q.media_url) {
    html += `<img src="${esc(q.media_url)}" style="max-width:100%; border-radius:8px; margin-bottom:15px;">`;
  }

  if (q.question_type === 'MCQ' && q.options) {
    const opts = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
    html += `<div style="display:flex; flex-direction:column; gap:10px;">`;
    opts.forEach(opt => {
      html += `<div style="padding:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;">
        <b>${opt.id})</b> ${esc(opt.text)}
      </div>`;
    });
    html += `</div>`;
  } 
  else if (q.question_type === 'TRUE_FALSE') {
    html += `<div style="display:flex; gap:10px;">
      <div style="flex:1; padding:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; text-align:center;">صح</div>
      <div style="flex:1; padding:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; text-align:center;">خطأ</div>
    </div>`;
  }
  else {
    html += `<input type="text" disabled placeholder="إجابة الطالب..." style="width:100%; padding:12px; border:2px solid #d8e2ec; border-radius:8px;">`;
  }

  $('#previewContent').innerHTML = html;
  $('#previewModal').classList.remove('hidden');
}

// ==========================================
// 7. ربط الأحداث
// ==========================================
function bindEvents() {
  $('#btnAddQuestion').addEventListener('click', openAddQuestion);
  $('#qType').addEventListener('change', toggleQuestionTypeFields);
  $('#questionForm').addEventListener('submit', saveQuestion);
  
  $('#btnPreview').addEventListener('click', () => {
    const fakeQ = {
      question_text: $('#qText').value || 'نص السؤال...',
      media_url: $('#qMedia').value || null,
      question_type: $('#qType').value,
      options: $('#qType').value === 'MCQ' 
        ? Array.from(document.querySelectorAll('.opt-text')).map(el => ({ id: el.dataset.id, text: el.value }))
        : null
    };
    let html = `<div style="margin-bottom:15px; font-size:16px; font-weight:bold; color:#1a3a5c;">${esc(fakeQ.question_text)}</div>`;
    if (fakeQ.media_url) html += `<img src="${esc(fakeQ.media_url)}" style="max-width:100%; border-radius:8px; margin-bottom:15px;">`;
    if (fakeQ.question_type === 'MCQ') {
      html += `<div style="display:flex; flex-direction:column; gap:10px;">`;
      fakeQ.options.forEach(opt => {
        html += `<div style="padding:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;"><b>${opt.id})</b> ${esc(opt.text)}</div>`;
      });
      html += `</div>`;
    } else if (fakeQ.question_type === 'TRUE_FALSE') {
      html += `<div style="display:flex; gap:10px;"><div style="flex:1; padding:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; text-align:center;">صح</div><div style="flex:1; padding:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; text-align:center;">خطأ</div></div>`;
    } else {
      html += `<input type="text" disabled placeholder="إجابة الطالب..." style="width:100%; padding:12px; border:2px solid #d8e2ec; border-radius:8px;">`;
    }
    $('#previewContent').innerHTML = html;
    $('#previewModal').classList.remove('hidden');
  });

  $('#searchQ').addEventListener('input', renderQuestions);
  $('#filterSubject').addEventListener('change', renderQuestions);
  $('#filterType').addEventListener('change', renderQuestions);
  $('#filterDifficulty').addEventListener('change', renderQuestions);

  ['questionModal', 'previewModal'].forEach(id => {
    $('#' + id).addEventListener('click', (e) => {
      if (e.target.id === id) closeModal(id);
    });
  });
}

// تشغيل
init();
</script>
