<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دخول الأدمن</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Tahoma; background: #1a1a2e; color: #fff;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    .box { background: #16213e; padding: 30px; border-radius: 12px;
           width: 320px; border: 1px solid #0f3460; }
    h2 { color: #e94560; text-align: center; margin-top: 0; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box;
            border-radius: 6px; border: 1px solid #0f3460;
            background: #1a1a2e; color: #fff; }
    button { width: 100%; padding: 10px; margin-top: 10px;
             background: #e94560; color: #fff; border: none;
             border-radius: 6px; cursor: pointer; font-size: 15px; }
    button:hover { background: #c73650; }
    #msg { text-align: center; margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>دخول الأدمن</h2>
    <input type="text" id="id" placeholder="الرقم الوطني">
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <div id="msg"></div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://xxwgmtrroaxpcqrxkfqf.supabase.co',
      'sb_publishable_bXRJ3qQuHPTTfxg-NCDKqQ_NwdzAspV'
    );

    async function login() {
      const id = document.getElementById('id').value.trim();
      const pass = document.getElementById('pass').value;
      const msg = document.getElementById('msg');
      msg.textContent = 'جاري التحقق...';
      msg.style.color = '#8892b0';

      const { data, error } = await supabase.rpc('verify_admin', {
        p_id: id, p_pass: pass
      });

      if (error) { msg.textContent = 'خطأ: ' + error.message; msg.style.color = 'red'; return; }

      if (data && data.length > 0) {
        sessionStorage.setItem('timss_session', JSON.stringify({
          role: 'admin',
          national_id: data[0].national_id,
          full_name: data[0].full_name
        }));
        msg.textContent = '✅ نجح، جاري التحويل...';
        msg.style.color = '#6bff6b';
        setTimeout(() => { window.location.href = 'admin.html'; }, 500);
      } else {
        msg.textContent = '❌ بيانات خاطئة';
        msg.style.color = 'red';
      }
    }
  </script>
</body>
</html>
