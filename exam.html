<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبار — TIMSS 2027</title>
<style>
/* ===== الأنماط الأساسية ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'Tahoma', sans-serif;
  background: linear-gradient(135deg, #1a3a5c, #2c5f8a, #1e4d73);
  min-height: 100vh; color: #333; padding: 20px;
  padding-right: 180px;
  display: flex; flex-direction: column; align-items: center;
}
@media (max-width: 768px) {
  body { padding-right: 20px; } 
}
.hidden { display: none !important; }

.container {
  width: 100%; max-width: 900px; background: #fff;
  border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  overflow: hidden; animation: fadeIn .4s ease; margin-top: 20px;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity:1; transform:none;} }

.header {
  background: linear-gradient(135deg, #1a3a5c, #2c5f8a);
  color: #fff; padding: 20px 24px;
}
.header-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 15px;
}
.header h1 { font-size: 20px; }
.timer {
  background: rgba(255,255,255,.15); padding: 6px 14px;
  border-radius: 20px; font-size: 16px; font-weight: bold;
  font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px;
  transition: all 0.3s ease;
}
.timer.warning {
  background: #ef4444; color: #fff;
  animation: pulse 1s infinite;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

.progress-container {
  width: 100%; height: 8px; background: rgba(255,255,255,.2);
  border-radius: 4px; overflow: hidden;
}
.progress-bar {
  height: 100%; background: #4ade80; width: 0%;
  transition: width 0.3s ease;
}

.content { padding: 30px 24px; }
.question-meta {
  display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
}
.badge {
  padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: bold;
}
.badge-subject { background: #e0f2fe; color: #0284c7; }
.badge-diff { background: #fef08a; color: #854d0e; }
.badge-cog { background: #dcfce7; color: #166534; }
.badge-flag { background: #fef3c7; color: #d97706; cursor: pointer; border: 1px solid #fcd34d; }
.badge-flag.active { background: #d97706; color: #fff; }

.question-text {
  font-size: 20px; font-weight: 700; color: #1a3a5c;
  line-height: 1.6; margin-bottom: 25px;
}
.question-media {
  max-width: 100%; border-radius: 10px; margin-bottom: 20px;
  display: block; border: 1px solid #e2e8f0;
}

.options-list { display: flex; flex-direction: column; gap: 12px; }
.option-item {
  display: flex; align-items: center; gap: 15px; padding: 16px 20px;
  background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px;
  cursor: pointer; transition: all .2s; font-size: 16px;
}
.option-item:hover { background: #f1f5f9; border-color: #cbd5e1; }
.option-item.selected {
  background: #eff6ff; border-color: #3b82f6;
  box-shadow: 0 0 0 2px rgba(59,130,246,.2);
}
.option-radio {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid #cbd5e1;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .2s;
}
.option-item.selected .option-radio {
  border-color: #3b82f6; background: #3b82f6;
}
.option-item.selected .option-radio::after {
  content: ''; width: 8px; height: 8px;
  background: #fff; border-radius: 50%;
}
.option-label { font-weight: 700; color: #64748b; min-width: 25px; }
.option-text { flex: 1; }

.footer-actions {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0;
}
.btn {
  padding: 12px 24px; border-radius: 10px; border: none;
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all .2s; display: inline-flex;
  align-items: center; gap: 8px;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, #1a3a5c, #2c5f8a); color: #fff; }
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(26,58,92,.35); }
.btn-secondary { background: #e2e8f0; color: #475569; }
.btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
.btn-success { background: #16a34a; color: #fff; }
.btn-success:hover:not(:disabled) { background: #15803d; }

.side-bar {
  position: fixed; top: 20px; right: 20px; bottom: 20px; width: 140px;
  background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  padding: 12px 8px; z-index: 100; 
  border: 1px solid #e2e8f0;
  display: flex; justify-content: center;
}
.palette-container {
  display: grid; 
  grid-template-columns: repeat(3, 1fr);
  gap: 6px; 
  align-content: start;
  justify-items: center;
  width: 100%;
}
.side-bar::-webkit-scrollbar { display: none; }
.side-bar { -ms-overflow-style: none; scrollbar-width: none; }

.pallet-btn {
  width: 32px; height: 32px;
  border-radius: 50%; 
  border: 2px solid #e2e8f0;
  background: #fff; font-weight: bold; color: #64748b; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; font-size: 13px;
}
.pallet-btn:hover { border-color: #94a3b8; }
.pallet-btn.answered { background: #dcfce7; border-color: #22c55e; color: #166534; }
.pallet-btn.unanswered { background: #f1f5f9; border-color: #cbd5e1; color: #64748b; }
.pallet-btn.flagged { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
.pallet-btn.current { box-shadow: 0 0 0 3px rgba(59,130,246,.5); border-color: #3b82f6; transform: scale(1.1); }

.calc-wrapper {
  position: fixed; bottom: 20px; left: 20px; z-index: 200;
  display: flex; flex-direction: column-reverse; align-items: flex-start;
}
.calculator {
  display: none;
  width: 260px; background: #fff; border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  border: 1px solid #e2e8f0; overflow: hidden;
  flex-direction: column; margin-bottom: 10px;
}
.calc-wrapper:hover .calculator {
  display: flex; 
  animation: fadeInCalc 0.2s ease;
}
@keyframes fadeInCalc { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.calc-display {
  background: #1a3a5c; color: #fff; padding: 15px; text-align: left;
  font-size: 22px; font-family: monospace; font-weight: bold;
  min-height: 60px; display: flex; align-items: center; justify-content: flex-end;
}
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #e2e8f0; }
.calc-key {
  padding: 15px; background: #fff; border: none; font-size: 16px;
  cursor: pointer; transition: background 0.1s; font-family: inherit; font-weight: bold;
}
.calc-key:hover { background: #f1f5f9; }
.calc-key.op { background: #f8fafc; color: #0284c7; }
.calc-key.equal { background: #3b82f6; color: #fff; grid-column: span 2; }
.calc-key.clear { background: #fee2e2; color: #dc2626; }
.calc-toggle {
  width: 50px; height: 50px; border-radius: 50%; background: #1a3a5c;
  color: #fff; border: none; font-size: 24px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.2s;
}
.calc-toggle:hover { transform: scale(1.05); }

.result-screen { padding: 30px; }
.result-header { text-align: center; margin-bottom: 30px; }
.result-icon { font-size: 60px; margin-bottom: 10px; }
.score-circle {
  width: 120px; height: 120px; border-radius: 50%;
  border: 6px solid #e2e8f0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; margin: 0 auto 20px;
}
.score-circle.good { border-color: #22c55e; }
.score-circle.avg { border-color: #eab308; }
.score-circle.bad { border-color: #ef4444; }
.score-val { font-size: 32px; font-weight: 800; color: #1a3a5c; line-height: 1; }

.review-list { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
.review-item {
  border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; background: #fff;
}
.review-item.correct { border-right: 6px solid #22c55e; }
.review-item.wrong { border-right: 6px solid #ef4444; }
.review-q { font-size: 16px; font-weight: bold; color: #1a3a5c; margin-bottom: 15px; }
.review-ans { font-size: 14px; margin-bottom: 8px; }
.review-ans span { font-weight: bold; }
.review-explanation {
  background: #f8fafc; padding: 12px; border-radius: 8px;
  font-size: 14px; color: #475569; margin-top: 10px; border-right: 4px solid #3b82f6;
}

.toast-container {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 3000; display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: #333; color: #fff; padding: 12px 24px;
  border-radius: 10px; font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: toastIn .3s ease;
}
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }
.toast.warning { background: #d97706; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px);} to { opacity:1; transform:none;} }

.loading {
  position: fixed; inset: 0; background: rgba(15,30,50,.85);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; z-index: 5000; color: #fff;
}
.spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p style="margin-top: 15px; font-size: 16px;">جاري اختيار الأسئلة...</p>
</div>

<div class="container hidden" id="mainContainer">
  
  <div id="examView">
    <header class="header">
      <div class="header-top">
        <h1 id="examTitle">اختبار TIMSS</h1>
        <div class="timer" id="timerDisplay">⏱️ 40:00</div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
        <span id="progressText">السؤال 1 من 40</span>
        <span id="scoreText">0 نقاط</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </header>

    <div class="content">
      <div class="question-meta">
        <span class="badge badge-subject" id="qSubject">—</span>
        <span class="badge badge-diff" id="qDifficulty">—</span>
        <span class="badge badge-cog" id="qCognitive">—</span>
        <span class="badge badge-flag" id="qFlag" onclick="toggleFlag()">🚩 للمراجعة</span>
      </div>

      <div class="question-text" id="qText">—</div>
      <img id="qMedia" class="question-media hidden" src="" alt="صورة السؤال">
      <div class="options-list" id="optionsList"></div>
    </div>

    <div class="footer-actions">
      <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()">⬅️ السابق</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()">التالي ➡️</button>
      <button class="btn btn-success hidden" id="btnSubmit" onclick="submitExam()">✅ إنهاء وتسليم</button>
    </div>
  </div>

  <div id="resultView" class="result-screen hidden">
    <div class="result-header">
      <div class="result-icon" id="resIcon">🎉</div>
      <h1 class="result-title" id="resTitle">أحسنت!</h1>
      <p class="result-subtitle" id="resSubtitle">لقد أكملت الاختبار.</p>
      <div class="score-circle" id="resCircle">
        <div class="score-val" id="resScoreVal">0%</div>
      </div>
    </div>
    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;">
      <div style="text-align: center;">
        <div style="font-size: 24px; font-weight: bold; color: #16a34a;" id="resCorrect">0</div>
        <div style="font-size: 13px; color: #64748b;">إجابات صحيحة</div>
      </div>
      <div style="text-align: center;">
        <div style="font-size: 24px; font-weight: bold; color: #dc2626;" id="resWrong">0</div>
        <div style="font-size: 13px; color: #64748b;">إجابات خاطئة</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="location.href='student.html'" style="width: 100%; justify-content: center; margin-bottom: 30px;">🏠 العودة للرئيسية</button>
    
    <h2 style="color: #1a3a5c; margin-bottom: 15px; border-right: 4px solid #3b82f6; padding-right: 10px;">📝 مراجعة الإجابات</h2>
    <div class="review-list" id="reviewList"></div>
  </div>

</div>

<div class="side-bar hidden" id="sideBar">
  <div class="palette-container" id="paletteContainer"></div>
</div>

<div class="calc-wrapper hidden" id="calcWrapper">
  <button class="calc-toggle">🧮</button>
  <div class="calculator">
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-keys">
      <button class="calc-key clear" onclick="calcClear()">C</button>
      <button class="calc-key op" onclick="calcPress('(')">(</button>
      <button class="calc-key op" onclick="calcPress(')')">)</button>
      <button class="calc-key op" onclick="calcPress('/')">÷</button>
      
      <button class="calc-key" onclick="calcPress('7')">7</button>
      <button class="calc-key" onclick="calcPress('8')">8</button>
      <button class="calc-key" onclick="calcPress('9')">9</button>
      <button class="calc-key op" onclick="calcPress('*')">×</button>
      
      <button class="calc-key" onclick="calcPress('4')">4</button>
      <button class="calc-key" onclick="calcPress('5')">5</button>
      <button class="calc-key" onclick="calcPress('6')">6</button>
      <button class="calc-key op" onclick="calcPress('-')">-</button>
      
      <button class="calc-key" onclick="calcPress('1')">1</button>
      <button class="calc-key" onclick="calcPress('2')">2</button>
      <button class="calc-key" onclick="calcPress('3')">3</button>
      <button class="calc-key op" onclick="calcPress('+')">+</button>
      
      <button class="calc-key" onclick="calcPress('0')">0</button>
      <button class="calc-key" onclick="calcPress('.')">.</button>
      <button class="calc-key equal" onclick="calcEqual()">=</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<!-- إعداد مكتبة MathJax لعرض المعادلات الرياضية -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
    svg: { fontCache: 'global' }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script>
// ==========================================
// 1. الإعدادات الأساسية
// ==========================================
const DB = window.supabaseClient;
const $ = (sel) => document.querySelector(sel);

function toast(msg, type = 'info', ms = 3000) {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toastContainer').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms);
}

// ==========================================
// 2. الحالة العامة
// ==========================================
const state = {
  session: null,
  subject: null,
  examKey: null,
  questions: [],
  currentIndex: 0,
  answers: {},
  flags: {},
  timerInterval: null,
  examEndTime: null,
  timeLeft: 40 * 60,
  isFinished: false
};

function saveState() {
  if (state.isFinished) return;
  const data = {
    questions: state.questions,
    currentIndex: state.currentIndex,
    answers: state.answers,
    flags: state.flags,
    examEndTime: state.examEndTime
  };
  sessionStorage.setItem(state.examKey, JSON.stringify(data));
}

function clearState() {
  if (state.examKey) sessionStorage.removeItem(state.examKey);
}

// ==========================================
// 3. التهيئة
// ==========================================
async function init() {
  try {
    if (!DB) throw new Error('فشل الاتصال بقاعدة البيانات');

    const session = auth.getSession();
    if (!session || session.role !== 'student') { 
      sessionStorage.removeItem('timss_session');
      location.href = 'index.html'; 
      return; 
    }
    state.session = session;

    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('subject');
    if (!subject) throw new Error('المادة غير محددة');
    
    state.subject = subject;
    state.examKey = 'exam_state_' + subject;
    $('#examTitle').textContent = `اختبار ${subject}`;

    if (subject === 'رياضيات') {
      $('#calcWrapper').classList.remove('hidden');
    }

    const savedDataStr = sessionStorage.getItem(state.examKey);
    if (savedDataStr) {
      try {
        const savedData = JSON.parse(savedDataStr);
        const now = Date.now();
        const calculatedLeft = Math.max(0, Math.floor((savedData.examEndTime - now) / 1000));

        if (calculatedLeft > 0) {
          state.questions = savedData.questions;
          state.currentIndex = savedData.currentIndex;
          state.answers = savedData.answers;
          state.flags = savedData.flags;
          state.examEndTime = savedData.examEndTime;
          state.timeLeft = calculatedLeft;

          $('#loading').classList.add('hidden');
          $('#mainContainer').classList.remove('hidden');
          $('#sideBar').classList.remove('hidden');

          startTimer();
          renderQuestion();
          toast('تم استئناف الاختبار من حيث توقفت', 'info', 4000);
          enableUnloadWarning();
          return;
        } else {
          clearState();
          toast('انتهى وقت الاختبار أثناء غيابك', 'error', 4000);
        }
      } catch (e) {
        clearState();
      }
    }

    const { data: allQuestions, error: qErr } = await DB
      .from('questions')
      .select('*')
      .eq('subject', subject)
      .eq('is_active', true);
      
    if (qErr) throw qErr;
    if (!allQuestions || allQuestions.length === 0) throw new Error('لا توجد أسئلة متاحة.');

    const { data: attempts, error: aErr } = await DB
      .from('student_question_attempts')
      .select('question_id, is_correct')
      .eq('student_id', session.national_id)
      .eq('subject', subject);
      
    if (aErr) throw aErr;

    const attemptsMap = {};
    (attempts || []).forEach(a => attemptsMap[a.question_id] = a);

    let unanswered = [];
    let incorrect = [];
    let correct = [];

    allQuestions.forEach(q => {
      if (!attemptsMap[q.id]) unanswered.push(q);
      else if (!attemptsMap[q.id].is_correct) incorrect.push(q);
      else correct.push(q);
    });

    const shuffle = arr => arr.sort(() => Math.random() - 0.5);
    unanswered = shuffle(unanswered);
    incorrect = shuffle(incorrect);
    correct = shuffle(correct);

    let selected = [...unanswered, ...incorrect, ...correct].slice(0, 40);
    state.questions = shuffle(selected);

    if (state.questions.length === 0) throw new Error('لم يتم العثور على أسئلة مناسبة.');

    state.examEndTime = Date.now() + (40 * 60 * 1000);
    state.timeLeft = 40 * 60;

    saveState();

    $('#loading').classList.add('hidden');
    $('#mainContainer').classList.remove('hidden');
    $('#sideBar').classList.remove('hidden');

    startTimer();
    renderQuestion();
    enableUnloadWarning();

  } catch (err) {
    console.error(err);
    $('#loading').innerHTML = `
      <div style="text-align: center; padding: 20px; color: #fff;">
        <h2 style="color: #ef4444; margin-bottom: 15px;">⚠️ خطأ</h2>
        <p style="font-size: 16px;">${err.message}</p>
        <button onclick="location.href='student.html'" style="margin-top: 20px; padding: 10px 20px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; font-size: 16px;">العودة للرئيسية</button>
      </div>
    `;
  }
}

function enableUnloadWarning() {
  window.addEventListener('beforeunload', (e) => {
    if (!state.isFinished && Object.keys(state.answers).length > 0) {
      e.preventDefault();
      e.returnValue = 'هل أنت متأكد من مغادرة الاختبار؟ سيتم حفظ تقدمك ويمكنك العودة لاحقاً.';
    }
  });
}

function startTimer() {
  updateTimerDisplay();
  
  state.timerInterval = setInterval(() => {
    const now = Date.now();
    state.timeLeft = Math.max(0, Math.floor((state.examEndTime - now) / 1000));
    updateTimerDisplay();

    if (state.timeLeft <= 300 && state.timeLeft > 0) {
      $('#timerDisplay').classList.add('warning');
    }

    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      toast('انتهى الوقت! جاري تسليم الاختبار تلقائياً...', 'warning', 3000);
      submitExam(true); 
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const secs = (state.timeLeft % 60).toString().padStart(2, '0');
  $('#timerDisplay').textContent = `⏱️ ${mins}:${secs}`;
}

// ==========================================
// 4. عرض السؤال مع MathJax
// ==========================================
function renderQuestion() {
  const q = state.questions[state.currentIndex];
  const total = state.questions.length;

  $('#progressText').textContent = `السؤال ${state.currentIndex + 1} من ${total}`;
  $('#progressBar').style.width = `${((state.currentIndex + 1) / total) * 100}%`;

  $('#qSubject').textContent = q.subject;
  $('#qDifficulty').textContent = translateDiff(q.difficulty);
  $('#qCognitive').textContent = translateCog(q.cognitive);
  
  // استخدام innerHTML بدلاً من textContent لدعم وسوم <br> والمعادلات
  $('#qText').innerHTML = q.question_text;

  // إخبار MathJax بمعالجة النص الجديد
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([document.getElementById('qText')]).catch(err => console.log(err));
  }

  const flagBtn = $('#qFlag');
  if (state.flags[q.id]) {
    flagBtn.classList.add('active');
    flagBtn.innerHTML = '🚩 محدد للمراجعة';
  } else {
    flagBtn.classList.remove('active');
    flagBtn.innerHTML = '🚩 للمراجعة';
  }

  if (q.media_url) {
    $('#qMedia').src = q.media_url;
    $('#qMedia').classList.remove('hidden');
  } else {
    $('#qMedia').classList.add('hidden');
  }

  const optionsList = $('#optionsList');
  optionsList.innerHTML = '';
  if (q.options && Array.isArray(q.options)) {
    q.options.forEach(opt => {
      const isSelected = state.answers[q.id] === opt.id;
      const el = document.createElement('div');
      el.className = `option-item ${isSelected ? 'selected' : ''}`;
      el.onclick = () => selectOption(q.id, opt.id);
      el.innerHTML = `
        <div class="option-radio"></div>
        <span class="option-label">${opt.id}.</span>
        <span class="option-text">${esc(opt.text)}</span>
      `;
      optionsList.appendChild(el);
    });
  }

  $('#btnPrev').disabled = state.currentIndex === 0;
  if (state.currentIndex === total - 1) {
    $('#btnNext').classList.add('hidden');
    $('#btnSubmit').classList.remove('hidden');
  } else {
    $('#btnNext').classList.remove('hidden');
    $('#btnSubmit').classList.add('hidden');
  }

  updateScoreDisplay();
  renderSideBar();
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderSideBar() {
  const container = $('#paletteContainer');
  container.innerHTML = state.questions.map((q, index) => {
    let statusClass = 'unanswered';
    if (state.answers[q.id]) statusClass = 'answered';
    if (state.flags[q.id]) statusClass = 'flagged';
    if (index === state.currentIndex) statusClass += ' current';
    
    return `<button class="pallet-btn ${statusClass}" onclick="jumpToQuestion(${index})">${index + 1}</button>`;
  }).join('');
}

function jumpToQuestion(index) {
  state.currentIndex = index;
  renderQuestion();
  saveState();
}

function toggleFlag() {
  const q = state.questions[state.currentIndex];
  state.flags[q.id] = !state.flags[q.id];
  renderQuestion();
  saveState();
}

function translateDiff(d) {
  if (d === 'EASY') return 'سهل';
  if (d === 'MEDIUM') return 'متوسط';
  if (d === 'HARD') return 'صعب';
  return d;
}
function translateCog(c) {
  if (c === 'KNOWING') return 'معرفة';
  if (c === 'APPLYING') return 'تطبيق';
  if (c === 'REASONING') return 'استدلال';
  return c;
}

// ==========================================
// 5. التنقل والإجابة
// ==========================================
function selectOption(questionId, optionId) {
  state.answers[questionId] = optionId;
  renderQuestion();
  saveState();
}

function prevQuestion() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderQuestion();
    saveState();
  }
}

function nextQuestion() {
  if (state.currentIndex < state.questions.length - 1) {
    state.currentIndex++;
    renderQuestion();
    saveState();
  }
}

function updateScoreDisplay() {
  let score = 0;
  state.questions.forEach(q => {
    if (state.answers[q.id] === q.correct_answer) {
      score += Number(q.points || 2.5);
    }
  });
  $('#scoreText').textContent = `${score.toFixed(1)} نقاط`;
}

// ==========================================
// 6. تسليم الاختبار
// ==========================================
async function submitExam(isAutoSubmit = false) {
  if (state.isFinished) return;

  if (!isAutoSubmit) {
    const unanswered = state.questions.filter(q => !state.answers[q.id]);
    if (unanswered.length > 0) {
      if (!confirm(`لديك ${unanswered.length} أسئلة لم تجب عليها. هل أنت متأكد من التسليم؟`)) return;
    } else {
      if (!confirm('هل أنت متأكد من إنهاء الاختبار وتسليم إجاباتك؟')) return;
    }
  }

  $('#btnSubmit').disabled = true;
  $('#btnSubmit').textContent = 'جاري الحفظ...';

  try {
    let correctCount = 0;
    const payloads = state.questions.map(q => {
      const studentAns = state.answers[q.id] || null;
      const isCorrect = studentAns ? String(studentAns) === String(q.correct_answer) : false;
      if (isCorrect) correctCount++;

      return {
        student_id: state.session.national_id,
        question_id: q.id,
        student_answer: studentAns ? JSON.stringify(studentAns) : null,
        is_correct: isCorrect,
        score: isCorrect ? Number(q.points || 2.5) : 0,
        subject: q.subject,
        branch: q.branch,
        cognitive: q.cognitive,
        difficulty: q.difficulty,
        updated_at: new Date().toISOString()
      };
    });

    const { error } = await DB
      .from('student_question_attempts')
      .upsert(payloads, { onConflict: 'student_id,question_id' });

    if (error) throw error;

    clearInterval(state.timerInterval);
    state.isFinished = true;
    clearState();
    showResults(correctCount);

  } catch (err) {
    console.error(err);
    toast('فشل حفظ النتيجة: ' + err.message, 'error', 5000);
    $('#btnSubmit').disabled = false;
    $('#btnSubmit').textContent = '✅ إنهاء وتسليم';
  }
}

// ==========================================
// 7. شاشة النتيجة والمراجعة مع MathJax
// ==========================================
function showResults(correctCount) {
  $('#examView').classList.add('hidden');
  $('#sideBar').classList.add('hidden');
  $('#calcWrapper').classList.add('hidden');
  $('#resultView').classList.remove('hidden');

  const total = state.questions.length;
  const percentage = Math.round((correctCount / total) * 100);
  
  $('#resScoreVal').textContent = `${percentage}%`;
  $('#resCorrect').textContent = correctCount;
  $('#resWrong').textContent = total - correctCount;

  const circle = $('#resCircle');
  if (percentage >= 80) {
    $('#resIcon').textContent = '🏆'; $('#resTitle').textContent = 'ممتاز!';
    circle.className = 'score-circle good';
  } else if (percentage >= 50) {
    $('#resIcon').textContent = '👍'; $('#resTitle').textContent = 'جيد جداً!';
    circle.className = 'score-circle avg';
  } else {
    $('#resIcon').textContent = '💪'; $('#resTitle').textContent = 'تحتاج لمزيد من التدريب';
    circle.className = 'score-circle bad';
  }

  const reviewList = $('#reviewList');
  reviewList.innerHTML = state.questions.map((q, i) => {
    const studentAns = state.answers[q.id];
    const isCorrect = studentAns ? String(studentAns) === String(q.correct_answer) : false;
    const isUnanswered = !studentAns;
    
    let statusClass = isCorrect ? 'correct' : (isUnanswered ? '' : 'wrong');
    let statusText = isCorrect ? '✔ إجابة صحيحة' : (isUnanswered ? '⚠️ لم تتم الإجابة' : '✘ إجابة خاطئة');
    
    const correctOption = q.options ? q.options.find(o => o.id === q.correct_answer) : null;
    const correctText = correctOption ? `${correctOption.id}) ${correctOption.text}` : q.correct_answer;

    return `
      <div class="review-item ${statusClass}">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
          <span style="font-weight: bold; color: #64748b;">السؤال ${i + 1}</span>
          <span style="font-weight: bold; color: ${isCorrect ? '#16a34a' : (isUnanswered ? '#d97706' : '#dc2626')};">${statusText}</span>
        </div>
        <div class="review-q">${q.question_text}</div>
        <div class="review-ans">
          إجابتك: <span style="color: ${isCorrect ? '#16a34a' : '#dc2626'};">${studentAns ? studentAns : 'لم يجب'}</span>
        </div>
        <div class="review-ans">
          الإجابة الصحيحة: <span style="color: #16a34a;">${correctText}</span>
        </div>
        ${q.explanation ? `<div class="review-explanation">💡 <b>الشرح:</b> ${q.explanation}</div>` : ''}
      </div>
    `;
  }).join('');

  // معالجة المعادلات في شاشة المراجعة
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([document.getElementById('reviewList')]).catch(err => console.log(err));
  }
}

// ==========================================
// 8. الآلة الحاسبة
// ==========================================
function calcPress(val) {
  const disp = $('#calcDisplay');
  if (disp.textContent === '0' && val !== '.') disp.textContent = val;
  else disp.textContent += val;
}

function calcClear() { 
  $('#calcDisplay').textContent = '0'; 
}

function calcEqual() {
  const disp = $('#calcDisplay');
  try {
    const result = eval(disp.textContent.replace(/[^-()\d/*+.]/g, ''));
    disp.textContent = result;
  } catch (e) {
    disp.textContent = 'خطأ';
  }
}

init();
</script>
</body>
</html>
